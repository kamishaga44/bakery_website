
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fffaf5;
            color: #333;
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
        }

        form {
            background: white;
            padding: 24px;
            border: 1px solid #eadfd5;
            border-radius: 12px;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            font-size: 16px;
        }

        button {
            background: #754c35;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .error {
            color: #b42318;
        }
    </style>
</head>
<body>
    <h1>Вход в админку</h1>

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="password">Пароль администратора</label>
        <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
        >

        <button type="submit">Войти</button>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </form>
</body>
</html>
